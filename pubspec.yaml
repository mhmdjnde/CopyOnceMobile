name: copy_once
description: A cross-platform clipboard sync app.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.3.1

  # Draws the authenticator QR from the enrollment URI, so the secret is
  # rendered on-device and never fetched from a remote image service.
  qr_flutter: ^4.1.0

  # Hashes clipboard content for the duplicate check. Declared explicitly rather
  # than leaned on as a transitive dependency of supabase_flutter.
  crypto: ^3.0.6

  # Tells Wi-Fi from mobile data, for the "Wi-Fi only" setting.
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.3
  image: ^4.9.1
  gal: ^2.3.3
  uuid: ^4.6.0

# jni 1.0.1 does not build against Android Gradle Plugin 9, which this project
# uses. Its build.gradle skips `apply plugin: 'kotlin-android'` when AGP is 9 or
# newer, then calls a top-level `kotlin { }` block that nothing has registered —
# so Gradle fails with "Could not find method kotlin()". 1.0.0 has no such block
# and builds cleanly.
#
# jni arrives transitively (path_provider_android -> jni), so nothing here asks
# for it directly. Remove this override once jni ships a fix for AGP 9.
dependency_overrides:
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates the launcher icons from assets/icon/. Dev-only: it runs at build
  # time and ships nothing.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/copyonce_logo.png

# Launcher icons, generated with `dart run flutter_launcher_icons`.
#
# The source is the clipboard mark on its own, not the full wordmark: the logo is
# a horizontal lockup whose text is illegible at 48dp.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  # Adaptive icons are cropped to a circle or squircle by the launcher, so the
  # mark is supplied separately at a size that survives the crop.
  adaptive_icon_background: "#F6F4EF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
